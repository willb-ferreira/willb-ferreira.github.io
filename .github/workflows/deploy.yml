name: Deploy academic website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild public pages from current content
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
          python scripts/generate_sitemap.py
          python scripts/prerender.py
      - name: Check published canonical URLs and SEO metadata
        run: python scripts/test_domain.py
      - name: Validate functionality, publication sync, directories and responsive layouts
        run: |
          python scripts/test_site.py
          python scripts/test_sync_academic.py
          python scripts/test_directories.py
          python scripts/test_responsive.py
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
