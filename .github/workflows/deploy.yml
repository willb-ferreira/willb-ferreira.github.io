name: Deploy academic website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Read main after acquiring the shared deployment queue: academic sync
          # may have committed newer metadata without triggering another deploy.
          ref: main
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Rebuild public pages from current content
        run: |
          python -m pip install playwright==1.64.0
          python -m playwright install chromium --with-deps
          python scripts/generate_sitemap.py
          python scripts/prerender.py
          python scripts/generate_security_headers.py
      - name: Check published canonical URLs and SEO metadata
        run: python scripts/test_domain.py
      - name: Validate functionality, publication sync, directories and responsive layouts
        run: |
          python scripts/test_site.py
          python scripts/test_sync_academic.py
          python scripts/test_directories.py
          python scripts/test_responsive.py
          python scripts/test_stage_public.py
      - name: Stage and validate the public website package
        run: |
          python scripts/stage_public.py
          python scripts/test_security.py --root _site/public
      - name: Upload site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: '_site/public'
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
