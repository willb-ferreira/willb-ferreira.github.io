name: Validate research library

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install browser and dependencies
        run: |
          python -m pip install playwright==1.64.0
          python -m playwright install chromium --with-deps
      - name: Regenerate static pages and indexing files
        run: |
          python scripts/generate_sitemap.py
          python scripts/prerender.py
          python scripts/generate_security_headers.py
      - name: Validate custom domain metadata and indexing
        run: python scripts/test_domain.py
      - name: Validate site and bilingual research library
        run: python scripts/test_site.py
      - name: Validate publication sync
        run: python scripts/test_sync_academic.py
      - name: Validate directories and research topics
        run: python scripts/test_directories.py
      - name: Validate responsive layouts
        run: python scripts/test_responsive.py
      - name: Validate public deployment package and browser security
        run: |
          python scripts/test_stage_public.py
          python scripts/stage_public.py
          python scripts/test_security.py --root _site/public
