name: Sync public academic metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/sources.json'
      - 'scripts/sync_academic.py'
      - 'scripts/prerender.py'
      - '.github/workflows/sync-academic.yml'
  schedule:
    # Monday, 06:17 Recife (UTC-3); avoid the busy start of the hour.
    - cron: '17 9 * * 1'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Update metadata for explicitly approved DOIs and public repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/sync_academic.py
      - name: Rebuild public static HTML for indexing
        run: |
          python -m pip install playwright==1.64.0
          python -m playwright install chromium --with-deps
          python scripts/generate_sitemap.py
          python scripts/prerender.py
          python scripts/generate_security_headers.py
      - name: Check published canonical URLs and SEO metadata
        run: python scripts/test_domain.py
      - name: Validate functionality, publication sync, directories and responsive layouts
        run: |
          python scripts/test_site.py
          python scripts/test_sync_academic.py
          python scripts/test_directories.py
          python scripts/test_responsive.py
          python scripts/test_stage_public.py
      - name: Stage and validate the public website package
        run: |
          python scripts/stage_public.py
          python scripts/test_security.py --root _site/public
      - name: Commit checked outputs, if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add assets/auto-content.js data/sync-cache.json sitemap.xml robots.txt _headers *.html
            if ! git diff --cached --quiet; then
              git commit -m 'chore: sync approved academic metadata'
              git push
            fi
          fi
      # Commits made by GITHUB_TOKEN do NOT trigger a separate Pages build.
      # Publish this run's generated files directly to Pages instead.
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload generated site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: '_site/public'
      - name: Deploy updated site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
