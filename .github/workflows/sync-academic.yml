name: Sync public academic metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/sources.json'
      - 'scripts/sync_academic.py'
      - '.github/workflows/sync-academic.yml'
  schedule:
    # Monday, 06:17 Recife (UTC-3); avoid the busy start of the hour.
    - cron: '17 9 * * 1'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update metadata for explicitly approved DOIs and public repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/sync_academic.py
      - name: Rebuild public static HTML for indexing
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
          python scripts/generate_sitemap.py
          python scripts/prerender.py
      - name: Check published canonical URLs and SEO metadata
        run: python scripts/test_domain.py
      - name: Commit checked outputs, if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add assets/auto-content.js data/sync-cache.json sitemap.xml robots.txt *.html
            if ! git diff --cached --quiet; then
              git commit -m 'chore: sync approved academic metadata'
              git push
            fi
          fi
      # Commits made by GITHUB_TOKEN do NOT trigger a separate Pages build.
      # Publish this run's generated files directly to Pages instead.
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload generated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy updated site
        id: deployment
        uses: actions/deploy-pages@v4
