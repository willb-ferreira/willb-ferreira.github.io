name: Verify public domain redirects

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/check_live_domain.py
      - .github/workflows/verify-live-domain.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check apex, www, legacy GitHub Pages, HTTPS and canonical URLs
        run: python scripts/check_live_domain.py
